name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Elle tetikleme: pull_request olayı GitHub tarafında düştüğünde (26 Ağustos
  # 2026'da olduğu gibi PR açılıyor ama kontrol paketi hiç oluşmuyor) dalı
  # doğrulamanın bir yolu olmalı. Aksi hâlde "yeşil mi" sorusunun cevabı
  # yalnızca yerel çalıştırmaya kalıyor.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ayna
          POSTGRES_PASSWORD: ayna
          POSTGRES_DB: ayna
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ayna"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ayna:ayna@localhost:5432/ayna?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key-0000
      # Duman testi yönetici olarak giriş yapıp uzman hesabını AÇIYOR:
      # onay kapısı eklendikten sonra uzman onaysız katalogda görünmüyor
      # ve akışın tamamı ancak onayla birlikte sınanabiliyor. Şifre CI'a
      # özel; veritabanı her koşuda sıfırdan kuruluyor.
      ADMIN_BOOTSTRAP_PASSWORD: ci-admin-Duman1234
    steps:
      - uses: actions/checkout@v4
      # pnpm sürümü package.json'daki "packageManager" alanından okunur (çift tanım = hata)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ayna/api db:generate
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # ── DUMAN TESTİ — gerçek sunucu, gerçek veritabanı, gerçek HTTP ──
      #
      # Birim testleri iki tarafı AYRI AYRI doğruluyor; aradaki sözleşmeye
      # bakan bir şey yoktu ve tam oradan kırıldı: uygulama hizmet
      # satırlarını `serviceId` ile göndermeye başlayınca kayıt şeması hâlâ
      # `id` istiyordu. Hizmet seçen HER uzman kayıt olamıyordu, canlıya
      # çıktı ve hiçbir test kızarmadı.
      #
      # İş zaten Postgres ile çalışıyor; sunucuyu ayağa kaldırıp gerçek
      # gövdeleri gerçek uçlara göndermenin maliyeti yaklaşık yarım dakika.
      - name: Şema veritabanına
        run: pnpm --filter @ayna/api exec prisma db push --skip-generate --accept-data-loss
      - name: Sunucuyu başlat
        working-directory: apps/api
        run: |
          node dist/main.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          # Hazır olana kadar bekle; 60 sn sonra pes et ve LOG'U BAS —
          # sessiz bir zaman aşımı hata ayıklanamaz.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/api/v1/taxonomy; then
              echo "sunucu hazır ($i sn)"; exit 0
            fi
            sleep 1
          done
          echo "SUNUCU AÇILMADI — log:"; cat /tmp/api.log; exit 1
      - name: Duman testi
        run: pnpm --filter @ayna/api smoke
      - name: Sunucu logu (yalnız hata durumunda)
        if: failure()
        run: cat /tmp/api.log || true
      - name: Sunucuyu durdur
        if: always()
        run: kill "$(cat /tmp/api.pid)" 2>/dev/null || true
